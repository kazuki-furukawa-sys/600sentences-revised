<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英作文 GRAND PRIX</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --border: #2a2a3a;
    --accent: #00e5ff;
    --accent2: #ff4081;
    --gold: #ffd700;
    --green: #00e676;
    --red: #ff1744;
    --text: #e8e8f0;
    --muted: #6060a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(0,229,255,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(255,64,129,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 24px 16px; }

  /* HEADER */
  .header {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }
  .header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 6vw, 3.6rem);
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(0,229,255,0.4);
  }
  .header p {
    font-size: 0.75rem;
    letter-spacing: 4px;
    color: var(--muted);
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* PANELS */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .panel-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '▶';
    color: var(--accent);
    font-size: 0.7rem;
  }

  /* SECTION SELECT */
  .section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 8px;
  }
  .section-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.78rem;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.4;
  }
  .section-btn:hover { border-color: var(--accent); color: var(--accent); }
  .section-btn.active {
    background: rgba(0,229,255,0.12);
    border-color: var(--accent);
    color: var(--accent);
  }
  .section-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    display: block;
    margin-bottom: 2px;
  }

  /* NUMBER RANGE SELECT */
  .range-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .range-label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  .range-input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    width: 72px;
    text-align: center;
  }
  .range-input:focus { outline: none; border-color: var(--accent); }

  .quick-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.15s;
  }
  .quick-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ORDER MODE */
  .mode-row { display: flex; gap: 10px; }
  .mode-btn {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    text-align: center;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: rgba(255,64,129,0.12);
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .mode-btn:hover:not(.active) { border-color: var(--border); color: var(--text); }
  .mode-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }

  /* START BTN */
  .start-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #0097a7);
    border: none;
    color: #000;
    padding: 18px;
    border-radius: 10px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,229,255,0.3); }
  .start-btn:active { transform: translateY(0); }

  /* GAME SCREEN */
  #game-screen { display: none; }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .stat-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--accent);
    line-height: 1.1;
  }
  .stat-val.red { color: var(--red); }
  .stat-val.green { color: var(--green); }

  /* QUESTION CARD */
  .question-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 28px;
    margin-bottom: 16px;
    position: relative;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .q-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .q-progress {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .q-japanese {
    font-size: clamp(1.1rem, 3vw, 1.45rem);
    line-height: 1.7;
    color: var(--text);
    font-weight: 700;
    text-align: center;
    padding: 8px 0 4px;
  }

  /* ANSWER INPUT */
  .answer-wrap { position: relative; }
  .answer-input {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--text);
    padding: 16px 20px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    transition: border-color 0.2s;
    outline: none;
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { border-color: var(--green); background: rgba(0,230,118,0.06); }
  .answer-input.wrong { border-color: var(--red); background: rgba(255,23,68,0.06); }
  .answer-input:disabled { opacity: 0.7; }

  /* FEEDBACK */
  .feedback {
    margin-top: 14px;
    padding: 16px 20px;
    border-radius: 8px;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .feedback.correct { background: rgba(0,230,118,0.1); border: 1px solid var(--green); }
  .feedback.wrong { background: rgba(255,23,68,0.08); border: 1px solid var(--red); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .feedback-icon { font-size: 1.5rem; margin-bottom: 6px; }
  .feedback-answer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    color: var(--text);
    line-height: 1.6;
    margin-top: 4px;
  }
  .feedback-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; letter-spacing: 2px; }

  /* GAME BTNS */
  .game-btns { display: flex; gap: 10px; margin-top: 14px; }
  .btn-submit {
    flex: 2;
    background: var(--accent);
    border: none;
    color: #000;
    padding: 14px;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-submit:hover { opacity: 0.85; }
  .btn-skip {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 14px;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-skip:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-next {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 14px;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
    display: none;
  }
  .btn-next:hover { background: rgba(0,229,255,0.1); }
  .btn-quit {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 14px;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
    display: none;
  }
  .btn-quit:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-end {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 14px;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-end:hover { border-color: var(--accent2); color: var(--accent2); }

  /* RESULT SCREEN */
  #result-screen { display: none; }
  .result-hero {
    text-align: center;
    padding: 40px 0 32px;
  }
  .result-grade {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 15vw, 7rem);
    line-height: 1;
    background: linear-gradient(135deg, var(--gold), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
  }
  .result-score {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--text);
    margin-top: 8px;
    letter-spacing: 3px;
  }
  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0;
  }
  .result-stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 12px;
    text-align: center;
  }
  .result-stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.4rem;
    line-height: 1;
  }
  .result-stat-val.g { color: var(--green); }
  .result-stat-val.r { color: var(--red); }
  .result-stat-val.b { color: var(--muted); }
  .result-stat-label { font-size: 0.7rem; letter-spacing: 2px; color: var(--muted); margin-top: 4px; }

  /* MISSED LIST */
  .missed-section { margin-top: 20px; }
  .missed-title {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 3px;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .missed-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--red);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 8px;
    font-size: 0.88rem;
  }
  .missed-ja { color: var(--muted); margin-bottom: 6px; font-size: 0.82rem; }
  .missed-en { font-family: 'JetBrains Mono', monospace; color: var(--text); line-height: 1.5; }

  .retry-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 15px;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 16px;
  }
  .retry-btn:hover { background: rgba(0,229,255,0.1); }
  .back-btn {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 13px;
    border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .back-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* Progress bar */
  .progress-bar-wrap {
    background: var(--border);
    border-radius: 4px;
    height: 4px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  /* answer diff */
  .diff-wrap { margin-top: 8px; }
  .diff-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 2px; margin-bottom: 3px; }
  .diff-text { font-family: 'JetBrains Mono', monospace; font-size: 0.88rem; line-height: 1.6; }
  .diff-ok { color: var(--green); }
  .diff-bad { color: var(--red); text-decoration: underline; }

  @media (max-width: 480px) {
    .section-grid { grid-template-columns: repeat(2, 1fr); }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .result-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1>英作文 GRAND PRIX</h1>
    <p>NANSHUN ENGLISH · COMPOSITION CHALLENGE</p>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setup-screen">

    <!-- SECTION SELECT (複数選択可) -->
    <div class="panel">
      <div class="panel-title">SECTION を選ぶ(複数選択可)</div>
      <div class="quick-btns" style="margin-bottom:12px;">
        <button class="quick-btn" onclick="selectAllSections()">全選択</button>
        <button class="quick-btn" onclick="clearSections()">全解除</button>
        <span class="range-label" id="sel-count" style="align-self:center;">0 セクション選択中</span>
      </div>
      <div class="section-grid" id="section-grid"></div>
    </div>

    <!-- QUESTION RANGE -->
    <div class="panel">
      <div class="panel-title">練習する番号</div>
      <div class="range-row" style="margin-bottom:12px;">
        <span class="range-label">No.</span>
        <input type="number" class="range-input" id="q-from" value="1" min="1" max="15">
        <span class="range-label">〜</span>
        <input type="number" class="range-input" id="q-to" value="15" min="1" max="15">
        <span class="range-label">番</span>
      </div>
      <div class="quick-btns">
        <button class="quick-btn" onclick="setRange(1,5)">1–5</button>
        <button class="quick-btn" onclick="setRange(6,10)">6–10</button>
        <button class="quick-btn" onclick="setRange(11,15)">11–15</button>
        <button class="quick-btn" onclick="setRange(1,15)">全部</button>
      </div>
    </div>

    <!-- ORDER MODE -->
    <div class="panel">
      <div class="panel-title">出題順序</div>
      <div class="mode-row">
        <button class="mode-btn active" id="mode-order" onclick="setMode('order')">
          <span class="mode-icon">📋</span>順番通り
        </button>
        <button class="mode-btn" id="mode-random" onclick="setMode('random')">
          <span class="mode-icon">🔀</span>ランダム
        </button>
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">▶ START GRAND PRIX</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">PROGRESS</div>
        <div class="stat-val" id="stat-progress">0/0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">CORRECT</div>
        <div class="stat-val green" id="stat-correct">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">WRONG</div>
        <div class="stat-val red" id="stat-wrong">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">SECTION</div>
        <div class="stat-val" id="stat-section" style="font-size:1rem;padding-top:6px;">—</div>
      </div>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div class="question-card">
      <div class="q-meta">
        <span class="q-badge" id="q-section-label">—</span>
        <span class="q-progress" id="q-num-label">— / —</span>
      </div>
      <div class="q-japanese" id="q-japanese">—</div>
    </div>

    <div class="answer-wrap">
      <input type="text" class="answer-input" id="answer-input" placeholder="英語で入力してEnterで確定..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>

    <div class="feedback" id="feedback">
      <div class="feedback-icon" id="feedback-icon"></div>
      <div class="feedback-label">ANSWER</div>
      <div class="feedback-answer" id="feedback-answer"></div>
      <div class="diff-wrap" id="diff-wrap"></div>
    </div>

    <div class="game-btns">
      <button class="btn-submit" id="btn-submit" onclick="submitAnswer()">SUBMIT</button>
      <button class="btn-skip" id="btn-skip" onclick="skipQuestion()">SKIP</button>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">NEXT →</button>
      <button class="btn-quit" id="btn-quit" onclick="quitGame()">QUIT</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen">
    <div class="result-hero">
      <div class="result-grade" id="result-grade">—</div>
      <div class="result-score" id="result-score">0 / 0</div>
    </div>
    <div class="result-grid">
      <div class="result-stat">
        <div class="result-stat-val g" id="res-correct">0</div>
        <div class="result-stat-label">CORRECT</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-val r" id="res-wrong">0</div>
        <div class="result-stat-label">WRONG</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-val b" id="res-skipped">0</div>
        <div class="result-stat-label">SKIPPED</div>
      </div>
    </div>

    <div class="missed-section" id="missed-section"></div>

    <button class="retry-btn" onclick="retryGame()">↺ RETRY</button>
    <button class="back-btn" onclick="backToSetup()">← BACK TO SETUP</button>
  </div>

</div>

<script>
// ===== DATA =====
const SECTIONS = [
  { id: 1, title: "教室英語", data: [
    ["みなさん準備はいいですか。","Are you ready to begin ?"],
    ["自己紹介をします。","I'd like to introduce myself."],
    ["終わりましたか。次は私の番です。","Have you finished ? It's my turn."],
    ["もう一度言ってください。","Could you say that again, please ?"],
    ["質問があります。","May I ask a question ?"],
    ["20ページの5行目を見なさい。","Look at line 5 on page 20."],
    ["すみませんが，それはどういうつづりですか。","Excuse me, but how do you spell that ?"],
    ["次回の予習は何をすればいいですか。","What should we study for the next class ?"],
    ["「発音する」という単語の名詞形は何ですか。","What is the noun for the word \"pronounce\" ?"],
    ["プリントを後ろから集めてくれますか。","Can you collect the papers from the back ?"],
    ["improve という語を辞典で調べなさい。","Look up the word \"improve\" in your dictionary."],
    ["読み終えた人は手を挙げてください。","If you have finished reading, please raise your hand."],
    ["山元先生に用事があります。入ってもいいですか。","I need to talk to Mr. Yamamoto. May I come in ?"],
    ["宿題の提出期限は来週の火曜日ですか。","Should we submit the homework by next Tuesday ?"],
    ["言いたいことは分かりますが，賛成できません。","I see your point, but I'm afraid I cannot agree with you."],
  ]},
  { id: 2, title: "文型（１）", data: [
    ["学校は８時に始まります。","School begins at eight."],
    ["彼女はたいていバスで学校に来ます。","She usually comes to school by bus."],

// ===== STATE =====
let selectedSections = new Set();   // 複数選択対応
let orderMode = 'order';
let questions = [];
let qIndex = 0;
let correct = 0, wrong = 0, skipped = 0;
let missedList = [];
let answered = false;

// ===== INIT =====
function buildSectionGrid() {
  const grid = document.getElementById('section-grid');
  SECTIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'section-btn';
    btn.id = `sec-${s.id}`;
    btn.innerHTML = `<span class="section-num">${s.id}.</span>${s.title}`;
    btn.onclick = () => toggleSection(s.id);
    grid.appendChild(btn);
  });
}

function toggleSection(id) {
  if (selectedSections.has(id)) selectedSections.delete(id);
  else selectedSections.add(id);
  updateSectionUI();
}

function selectAllSections() {
  SECTIONS.forEach(s => selectedSections.add(s.id));
  updateSectionUI();
}

function clearSections() {
  selectedSections.clear();
  updateSectionUI();
}

function updateSectionUI() {
  SECTIONS.forEach(s => {
    document.getElementById(`sec-${s.id}`).classList.toggle('active', selectedSections.has(s.id));
  });
  document.getElementById('sel-count').textContent = `${selectedSections.size} セクション選択中`;
}

function setRange(from, to) {
  document.getElementById('q-from').value = from;
  document.getElementById('q-to').value = to;
}

function setMode(m) {
  orderMode = m;
  document.getElementById('mode-order').classList.toggle('active', m === 'order');
  document.getElementById('mode-random').classList.toggle('active', m === 'random');
}

function startGame() {
  if (selectedSections.size === 0) { alert('セクションを1つ以上選んでください。'); return; }
  const ids = [...selectedSections].sort((a, b) => a - b);
  const from = Math.max(1, parseInt(document.getElementById('q-from').value) || 1);
  const to = parseInt(document.getElementById('q-to').value) || 15;
  if (from > to) { alert('番号の範囲が正しくありません。'); return; }

  // Build question list (選択した全セクションから、共通の番号範囲で集める)
  let pool = [];
  ids.forEach(id => {
    const sec = SECTIONS.find(s => s.id === id);
    sec.data.slice(from - 1, to).forEach((d, i) => {
      pool.push({ ja: d[0], en: d[1], num: from + i, secId: sec.id, secTitle: sec.title });
    });
  });

  if (pool.length === 0) { alert('該当する問題がありません。'); return; }

  if (orderMode === 'random') {
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
  }
  questions = pool;
  qIndex = 0; correct = 0; wrong = 0; skipped = 0; missedList = [];

  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('stat-section').textContent =
    ids.length === 1 ? pool[0].secTitle : `${ids.length}セクション`;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = questions[qIndex];
  document.getElementById('q-section-label').textContent = `${q.secId}. ${q.secTitle}  No.${q.num}`;
  document.getElementById('q-num-label').textContent = `${qIndex + 1} / ${questions.length}`;
  document.getElementById('q-japanese').textContent = q.ja;
  document.getElementById('stat-progress').textContent = `${qIndex}/${questions.length}`;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;

  const fill = ((qIndex) / questions.length) * 100;
  document.getElementById('progress-fill').style.width = fill + '%';

  const input = document.getElementById('answer-input');
  input.value = '';
  input.className = 'answer-input';
  input.disabled = false;
  input.placeholder = '英語で入力してEnterで確定...';

  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';

  document.getElementById('btn-submit').style.display = '';
  document.getElementById('btn-skip').style.display = '';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-quit').style.display = 'none';

  input.focus();
}

function normalize(s) {
  return s.trim().toLowerCase()
    .replace(/[\u201c\u201d]/g, '"')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/\s+/g, ' ')
    .replace(/\s*\?\s*/g, ' ? ')
    .replace(/\s*!\s*/g, ' ! ')
    .replace(/\s*,\s*/g, ', ')
    .replace(/\s+/g, ' ')
    .trim();
}

function submitAnswer() {
  if (answered) return;
  const input = document.getElementById('answer-input');
  const userAns = input.value.trim();
  if (!userAns) return;

  const q = questions[qIndex];
  const isCorrect = normalize(userAns) === normalize(q.en);
  answered = true;

  input.disabled = true;
  input.className = 'answer-input ' + (isCorrect ? 'correct' : 'wrong');

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');

  document.getElementById('feedback-icon').textContent = isCorrect ? '✅' : '❌';
  document.getElementById('feedback-answer').textContent = q.en;

  const diffWrap = document.getElementById('diff-wrap');
  if (!isCorrect) {
    diffWrap.innerHTML = `<div class="diff-label">YOUR ANSWER</div><div class="diff-text">${escapeHtml(userAns)}</div>`;
    wrong++;
    missedList.push(q);
  } else {
    diffWrap.innerHTML = '';
    correct++;
  }

  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;

  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-skip').style.display = 'none';
  document.getElementById('btn-next').style.display = '';
  document.getElementById('btn-quit').style.display = '';
}

function skipQuestion() {
  if (answered) return;
  answered = true;
  skipped++;
  const q = questions[qIndex];
  missedList.push(q);

  const input = document.getElementById('answer-input');
  input.disabled = true;
  input.className = 'answer-input wrong';

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  fb.className = 'feedback wrong';
  document.getElementById('feedback-icon').textContent = '⏭';
  document.getElementById('feedback-answer').textContent = q.en;
  document.getElementById('diff-wrap').innerHTML = '';

  wrong++;
  document.getElementById('stat-wrong').textContent = wrong;

  document.getElementById('btn-submit').style.display = 'none';
  document.getElementById('btn-skip').style.display = 'none';
  document.getElementById('btn-next').style.display = '';
  document.getElementById('btn-quit').style.display = '';
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total = questions.length;
  const pct = Math.round((correct / total) * 100);
  let grade = 'F';
  if (pct >= 95) grade = 'S';
  else if (pct >= 85) grade = 'A';
  else if (pct >= 70) grade = 'B';
  else if (pct >= 55) grade = 'C';
  else if (pct >= 40) grade = 'D';

  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-score').textContent = `${pct}%  (${correct} / ${total})`;
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong - skipped;
  document.getElementById('res-skipped').textContent = skipped;

  const ms = document.getElementById('missed-section');
  if (missedList.length > 0) {
    ms.innerHTML = `<div class="missed-title">▸ MISSED / SKIPPED (${missedList.length})</div>`;
    missedList.forEach(q => {
      ms.innerHTML += `
        <div class="missed-item">
          <div class="missed-ja">${q.secId}-${q.num} ${escapeHtml(q.ja)}</div>
          <div class="missed-en">${escapeHtml(q.en)}</div>
        </div>`;
    });
  } else {
    ms.innerHTML = `<div style="text-align:center;padding:20px;color:var(--green);font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;">PERFECT — ALL CORRECT! 🎉</div>`;
  }
}

function quitGame() {
  if (!confirm('途中でやめますか？結果画面に移動します。')) return;
  showResult();
}

function retryGame() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  qIndex = 0; correct = 0; wrong = 0; skipped = 0; missedList = [];
  if (orderMode === 'random') {
    for (let i = questions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [questions[i], questions[j]] = [questions[j], questions[i]];
    }
  }
  showQuestion();
}

function backToSetup() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'block';
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Enter key to submit / next
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!answered) submitAnswer();
    else {
      const nxt = document.getElementById('btn-next');
      if (nxt.style.display !== 'none') nextQuestion();
    }
  }
});

buildSectionGrid();
</script>
</body>
</html>
